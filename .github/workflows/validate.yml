name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 固定 Python 工具链：ubuntu-latest 的 system pip 受 PEP 668 限制，后续 Pillow 安装需要
      # setup-python 提供的可写环境（P1-3）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: marketplace.json 合法性
        run: python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

      - name: 插件名保留字与 description 卫生
        run: |
          python3 - <<'EOF'
          import glob, json, re
          m = json.load(open('.claude-plugin/marketplace.json'))
          reserved_prefixes = ('claude-', 'anthropic-', 'anthropics-', 'cc-plugin-')
          reserved_exact = {'claude', 'anthropic', 'anthropics', 'claude-code', 'claude-mods'}
          for p in m['plugins']:
              name = p['name']
              assert name not in reserved_exact and not name.startswith(reserved_prefixes), \
                  f"插件名触发保留字规则: {name}（第三方插件不能以 claude-/anthropic-/anthropics-/cc-plugin- 开头）"
              desc = p.get('description', '')
              assert len(desc.encode('utf-8')) <= 1000, \
                  f"插件 description 超 1000 字节（{len(desc.encode('utf-8'))}）"
          bad = []
          for f in glob.glob('skills/*/SKILL.md'):
              text = open(f, encoding='utf-8').read()
              m = re.search(r'^description:\s*(.+)$', text, re.M)
              if not m:
                  bad.append(f"{f}: 缺 description")
                  continue
              desc = m.group(1)
              tags = re.findall(r'<[^>]+>', desc)
              if tags:
                  bad.append(f"{f}: description 含 XML 标签形态 {tags}")
              if len(desc.encode('utf-8')) > 1000:
                  bad.append(f"{f}: description 超 1000 字节（{len(desc.encode('utf-8'))}）")
          assert not bad, "\n".join(bad)
          print("OK: 插件名与 description 卫生检查通过")
          EOF

      - name: markdown 相对链接与路径引用存在性（断链零容忍）
        run: |
          python3 - <<'EOF'
          import os, re, subprocess
          broken = []
          link_re = re.compile(r'\[[^\]]*\]\(([^)\s]+)(?:\s+"[^"]*")?\)')
          # 只遍历 git 跟踪的 markdown：本地存在但被 .gitignore 排除的文件（如 poc/）不在
          # CI checkout 中，扫它们会造成「本地绿、CI 红」的不可复现差异（P1-3）
          tracked = subprocess.check_output(['git', 'ls-files', '-z', '*.md'], text=True).split('\0')
          for f in (x for x in tracked if x):
              if os.path.basename(f) == 'CHANGELOG.md':
                  continue
              dp = os.path.dirname(f) or '.'
              text = re.sub(r'```.*?```', '', open(f, encoding='utf-8').read(), flags=re.S)
              for m in link_re.finditer(text):
                  t = m.group(1)
                  if t.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  p = t.split('#')[0]
                  if p and not os.path.exists(os.path.normpath(os.path.join(dp, p))):
                      broken.append(f"{f} -> {t}")
              # harness=历史路径防回流守卫（v0.5.0 迁出，勿删）；doc=docs 笔误守卫
              for m in re.finditer(r'`(doc|docs|templates|harness|skills)/[A-Za-z0-9_\-./]+\.(md|json|py|sh|yaml|yml)`', text):
                  if not os.path.exists(m.group(0).strip('`')):
                      broken.append(f"{f} -> {m.group(0)}")
          assert not broken, "断链:\n" + "\n".join(broken)
          print("OK: 相对链接检查通过")
          EOF

      - name: runner 命令形态一致性（scripts/check_runner_form.py，基线 0 违规）
        run: python3 scripts/check_runner_form.py .

      - name: 对抗 prompt 共享核心段一致性（gate ↔ doubt，漂移零容忍）
        run: python3 scripts/check_adversarial_core.py

      - name: 每个 skill 目录有合法 frontmatter name（kebab-case）
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            name=$(awk '/^name:/{sub(/^name:[ ]*/,""); print; exit}' "$f")
            if [ -z "$name" ] || ! echo "$name" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "非法 name: $f -> '$name'"; fail=1
            fi
          done
          exit $fail

      - name: 模板脚本可执行位（git mode 100755）
        run: |
          python3 - <<'EOF'
          import subprocess
          must_exec = {
              'skills/sdlc-guardrails/templates/pre-commit',
              'skills/sdlc-test/templates/run_regression.sh',
          }
          modes = {}
          for line in subprocess.check_output(['git', 'ls-files', '-s'], text=True).splitlines():
              meta, path = line.split('\t', 1)
              modes[path] = meta.split()[0]
          bad = [p for p in sorted(must_exec) if modes.get(p) != '100755']
          assert not bad, "以下模板缺少可执行位（应为 100755）:\n" + "\n".join(bad)
          print("OK: 模板脚本可执行位检查通过")
          EOF

      - name: marketplace.json skills 数组与 skills/ 目录一致
        run: |
          python3 - <<'EOF'
          import json, os
          m = json.load(open('.claude-plugin/marketplace.json'))
          declared = {os.path.basename(p) for p in m['plugins'][0]['skills']}
          actual = {d for d in os.listdir('skills') if os.path.isdir(f'skills/{d}')}
          assert declared == actual, f"不一致: 仅在json={declared-actual} 仅在目录={actual-declared}"
          print(f"OK: {len(declared)} skills 一致")
          EOF

      - name: 敏感词防回归（应零命中）
        run: |
          ! rg -i --hidden "edu-region|临平|linping|saasstaffid|saasregionid|saastenantid|skill_contest|工作室|hailiang|10\.30\.|区域教学技能比赛|教学技能比赛" . \
            --glob '!.git' --glob '!CHANGELOG.md' --glob '!CLAUDE.md' --glob '!.github/**'

      - name: 守卫脚本 Python 语法检查（py_compile 逐文件）
        run: |
          fail=0
          for f in $(find scripts skills -name '*.py'); do
            python3 -m py_compile "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

      - name: parse_doc 内容守恒自检（--self-test）
        run: python3 skills/sdlc-intent/scripts/parse_doc.py --self-test

      # compare.py 顶层 import PIL，缺依赖 exit 2（P1-3 潜在第二红灯）；显式安装保证自检真的跑
      - name: 视觉比对依赖（Pillow）
        run: python3 -m pip install --disable-pip-version-check Pillow==12.3.0

      - name: compare.py 视觉比对自检（--self-test）
        run: python3 skills/sdlc-ui-visual/scripts/compare.py --self-test

      - name: 文档 skill 计数与 skills/ 目录一致（README 矩阵 + CLAUDE.md）
        run: |
          python3 - <<'EOF'
          import os, re
          actual = len([d for d in os.listdir('skills') if os.path.isdir(f'skills/{d}')])
          m1 = re.search(r'## (\d+) 个 skill 一览', open('README.md', encoding='utf-8').read())
          m2 = re.search(r'(\d+) 个可安装 skill', open('CLAUDE.md', encoding='utf-8').read())
          m3 = re.search(r'(\d+) 个 skill 均可独立运行', open('docs/faq.md', encoding='utf-8').read())
          assert m1, "README.md 未找到「## N 个 skill 一览」锚点（标题被改？）"
          assert m2, "CLAUDE.md 未找到「N 个可安装 skill」锚点（首段被改？）"
          assert m3, "docs/faq.md 未找到「N 个 skill 均可独立运行」锚点"
          assert int(m1.group(1)) == actual, f"README「Skill 矩阵」计数 {m1.group(1)} ≠ skills/ 目录数 {actual}"
          assert int(m2.group(1)) == actual, f"CLAUDE.md 计数 {m2.group(1)} ≠ skills/ 目录数 {actual}"
          assert int(m3.group(1)) == actual, f"docs/faq.md 计数 {m3.group(1)} ≠ skills/ 目录数 {actual}"
          print(f"OK: 文档 skill 计数一致（{actual}）")
          EOF

      - name: evals README 索引与场景文件双向对账
        run: |
          python3 - <<'EOF'
          import os, re, glob
          bad = []
          for rd in glob.glob('skills/*/evals/README.md'):
              d = os.path.dirname(rd)
              files = {m.group(1) for f in os.listdir(d)
                       for m in [re.match(r'(eval-[a-z0-9]+)[^/]*\.md$', f)] if m}
              indexed = set(re.findall(r'eval-[a-z0-9]+', open(rd, encoding='utf-8').read()))
              if files - indexed:
                  bad.append(f"{rd}: 文件未入 README 索引 {sorted(files - indexed)}")
              if indexed - files:
                  bad.append(f"{rd}: README 索引无对应文件 {sorted(indexed - files)}")
          assert not bad, "\n".join(bad)
          print(f"OK: evals 索引对账通过（{len(glob.glob('skills/*/evals/README.md'))} 个 README）")
          EOF

      - name: skills/ 内仓级路径引用检查（安装副本断链防回归）
        run: |
          python3 - <<'EOF'
          import re, glob
          # 声明性提及白名单：同仓阅读时指路仓库级 docs/ 文档，均带「skill 安装副本中缺失，以本文件为准」降级声明
          ALLOW = {
              'skills/sdlc-test/SKILL.md',
              'skills/sdlc-test/references/spec/spec-guide.md',
              'skills/sdlc-design/references/design-template.md',
              'skills/sdlc-design/references/trellis-handoff.md',
              'skills/sdlc-guardrails/README.md',
          }
          pat = re.compile(r'`(docs|templates|harness|poc)/[A-Za-z0-9_\-./]+\.(?:md|json|py|sh|yaml|yml)`')
          viol = [f"{f}:{i}: {m.group(0)}"
                  for f in glob.glob('skills/**/*.md', recursive=True)
                  for i, line in enumerate(open(f, encoding='utf-8'), 1)
                  for m in [pat.search(line)]
                  if m and f.replace('\\', '/') not in ALLOW]
          assert not viol, "仓级路径引用（skill 安装副本中断链）:\n" + "\n".join(viol)
          print("OK: skills/ 无 allowlist 外仓级路径引用")
          EOF

      - name: SKILL.md 行数上限（<500）
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            n=$(awk 'END{print NR}' "$f")
            if [ "$n" -ge 500 ]; then echo "超限: $f（${n} 行，上限 500）"; fail=1; fi
          done
          exit $fail
